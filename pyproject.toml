[project]
name = "notebooklm-mini"
version = "0.1.0"
description = "NotebookLM mini — RAG for Learning System (build-from-scratch, AIVN P1)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "langchain>=0.3,<0.4",
    "langchain-community>=0.3,<0.4",
    "langchain-qdrant>=0.2",
    "langchain-google-genai>=2.0",
    "langchain-huggingface>=0.1",
    "sentence-transformers>=3.0",
    "qdrant-client>=1.9",
    "pypdf>=4.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "jinja2>=3.1",
    "typer>=0.12",
    "streamlit>=1.38",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
